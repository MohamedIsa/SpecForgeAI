# SonarCloud project configuration for specforge-ai.
# organization/projectKey must match the project created on sonarcloud.io.
sonar.organization=mohamedisa
sonar.projectKey=MohamedIsa_SpecForgeAI

sonar.sources=apps/web/src,apps/backend/src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/dist/**,**/coverage/**,**/node_modules/**

sonar.tests=apps/web/src,apps/backend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
