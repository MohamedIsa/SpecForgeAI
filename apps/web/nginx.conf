server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 is Docker's embedded per-network DNS resolver. Combined
    # with a $-variable in proxy_pass below, this makes nginx resolve
    # "backend" at REQUEST time rather than when nginx itself starts — a
    # plain `proxy_pass http://backend:10000` (verified directly) makes
    # nginx refuse to start entirely with "host not found in upstream" if
    # the backend container isn't already resolvable at that exact instant,
    # which would turn a routine backend restart during a rolling deploy
    # into a full web-container outage instead of just failed API calls.
    resolver 127.0.0.11 valid=30s;

    # Production security headers.
    #
    # script-src has no 'unsafe-inline' (SEC-T6) — verified against a real
    # production build that the app emits zero inline <script> content, only
    # an external module script (`<script type="module" src="/assets/...">`),
    # so this doesn't break anything. connect-src is narrowed to 'self'
    # (SEC-T6) — the SPA only ever calls same-origin /trpc and /api (grepped
    # the whole source tree: no fetch/XHR/WebSocket targets any other
    # origin), so the previous `http: https: ws: wss:` was needless attack
    # surface for exfiltration via any future XSS.
    #
    # style-src and font-src still allow fonts.googleapis.com /
    # fonts.gstatic.com beyond SEC-T5's literal spec — index.html loads
    # Google Fonts from both origins, and dropping them would silently break
    # fonts in production (CSP failures are enforced client-side with no
    # server-visible error).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    # text/html is always gzip-compressed by nginx regardless of gzip_types
    # (it's compiled in as a mandatory default) — listing it again here
    # produces a harmless but noisy "duplicate MIME type" warning at startup.
    gzip_types
        application/javascript
        application/json
        text/css
        text/javascript
        text/plain;

    # SPA client-side routing fallback: any path that isn't a real static
    # file falls through to index.html so the app's own router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxied to the backend service (docker-compose.staging.yml's
    # "backend" hostname, resolved via the compose network's built-in DNS).
    location /trpc/ {
        set $backend_upstream http://backend:10000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # REPLACE, never append (the default $proxy_add_x_forwarded_for
        # appends onto whatever X-Forwarded-For a client already sent) — a
        # client sitting in front of this proxy could otherwise set its own
        # X-Forwarded-For with an arbitrary fake IP, which the backend's
        # trustProxy config (apps/backend/src/app.ts) would take as
        # authoritative, letting an attacker forge a different "IP" on every
        # request and bypass per-IP rate limiting entirely. $remote_addr is
        # the actual TCP peer nginx itself observed — not attacker-controlled.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $backend_upstream http://backend:10000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # REPLACE, never append (the default $proxy_add_x_forwarded_for
        # appends onto whatever X-Forwarded-For a client already sent) — a
        # client sitting in front of this proxy could otherwise set its own
        # X-Forwarded-For with an arbitrary fake IP, which the backend's
        # trustProxy config (apps/backend/src/app.ts) would take as
        # authoritative, letting an attacker forge a different "IP" on every
        # request and bypass per-IP rate limiting entirely. $remote_addr is
        # the actual TCP peer nginx itself observed — not attacker-controlled.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BRD uploads stream real files through this path — multipart bodies
        # up to MAX_BRD_FILE_BYTES (25MB) must not be rejected by nginx's
        # own body-size cap before they ever reach the backend.
        client_max_body_size 30m;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
}
