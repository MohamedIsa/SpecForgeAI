server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 is Docker's embedded per-network DNS resolver. Combined
    # with a $-variable in proxy_pass below, this makes nginx resolve
    # "backend" at REQUEST time rather than when nginx itself starts — a
    # plain `proxy_pass http://backend:10000` (verified directly) makes
    # nginx refuse to start entirely with "host not found in upstream" if
    # the backend container isn't already resolvable at that exact instant,
    # which would turn a routine backend restart during a rolling deploy
    # into a full web-container outage instead of just failed API calls.
    resolver 127.0.0.11 valid=30s;

    # Production security headers.
    #
    # style-src and font-src are extended beyond the ticket's literal spec
    # (`'self' 'unsafe-inline'` / `'self'`) to allow fonts.googleapis.com /
    # fonts.gstatic.com — index.html loads Google Fonts from both origins,
    # and the literal policy would silently block them in production
    # (CSP failures are enforced client-side with no server-visible error).
    # Every other directive matches the ticket exactly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    # text/html is always gzip-compressed by nginx regardless of gzip_types
    # (it's compiled in as a mandatory default) — listing it again here
    # produces a harmless but noisy "duplicate MIME type" warning at startup.
    gzip_types
        application/javascript
        application/json
        text/css
        text/javascript
        text/plain;

    # SPA client-side routing fallback: any path that isn't a real static
    # file falls through to index.html so the app's own router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxied to the backend service (docker-compose.staging.yml's
    # "backend" hostname, resolved via the compose network's built-in DNS).
    location /trpc/ {
        set $backend_upstream http://backend:10000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $backend_upstream http://backend:10000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BRD uploads stream real files through this path — multipart bodies
        # up to MAX_BRD_FILE_BYTES (25MB) must not be rejected by nginx's
        # own body-size cap before they ever reach the backend.
        client_max_body_size 30m;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
}
