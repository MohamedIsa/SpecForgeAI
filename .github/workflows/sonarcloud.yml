name: SonarCloud

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: specforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d specforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/specforge
      JWT_SECRET: ci-test-secret-not-for-production
      DEEPSEEK_API_KEY: ci-test-key-unused-ai-calls-are-stubbed-in-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud needs the full history (not a shallow clone) to
          # correctly attribute new vs. pre-existing issues on a PR.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # apps/web's test script passes NODE_OPTIONS=--no-experimental-webstorage,
          # a flag Node only recognizes from v22 onward; Node 20 rejects it outright.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run database migrations
        run: pnpm --filter @specforge/backend run migrate:up

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
